<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <div class="todo-header">To-do-List</div>
        <div class="todo-input-area">
            <input type="text" id="todoInput" class="todo-input" placeholder="Add your activity here...">
            <button id="addBtn" class="todo-btn">Add</button>
        </div>
        <ul id="todoList" class="todo-list">
            <li class="todo-item"><span>activity 1</span><button class="delete-btn">×</button></li>
            <li class="todo-item"><span>activity 2</span><button class="delete-btn">×</button></li>
            <li class="todo-item"><span>activity 3</span><button class="delete-btn">×</button></li>
            <li class="todo-item"><span>activity 4</span><button class="delete-btn">×</button></li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
