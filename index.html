<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header><h1>Internship Task Dashboard</h1></header>

    <main class="container">
        <!-- Task 8: Tabs -->
        <section class="card">
            <h2>8. Tabbed Navigation Menu</h2>
            <div class="tabs">
                <button class="tab-btn active" onclick="openTab(event, 'Home')">Home</button>
                <button class="tab-btn" onclick="openTab(event, 'Services')">Services</button>
                <button class="tab-btn" onclick="openTab(event, 'Contact')">Contact</button>
            </div>
            <div id="Home" class="tab-content active"><p>Welcome to the home section of our dashboard.</p></div>
            <div id="Services" class="tab-content"><p>We offer premium web development services.</p></div>
            <div id="Contact" class="tab-content"><p>Email us at: info@webdev.com</p></div>
        </section>

        <!-- Task 9: Todo -->
        <section class="card">
            <h2>9. Advanced To-do List</h2>
            <div class="todo-input">
                <input type="text" id="todoInput" placeholder="Add a new task...">
                <button onclick="addTodo()">Add Task</button>
            </div>
            <ul id="todoList"></ul>
        </section>

        <!-- Task 10: Slider -->
        <section class="card">
            <h2>10. Responsive Image Slider</h2>
            <div class="slider-wrapper">
                <div class="slider">
                    <img src="1000460551.jpg" class="active">
                    <img src="1000460550.jpg">
                    <img src="1000460549.jpg">
                    <img src="1000460548.jpg">
                </div>
                <button class="prev" onclick="move(-1)">&#10094;</button>
                <button class="next" onclick="move(1)">&#10095;</button>
            </div>
        </section>

        <!-- Task 11: Toggle -->
        <section class="card">
            <h2>11. Toggle Switch Control</h2>
            <div class="toggle-box">
                <div class="switch" id="toggleSwitch" onclick="toggleEmoji()">
                    <span class="emoji" id="emoji">☹</span>
                </div>
                <p id="statusText">System: ON</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
